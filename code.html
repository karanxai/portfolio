  <!-- React Application Logic with Babel -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ==========================================
    // 1. BACKGROUND MOVING DOTS CANVAS LOGIC
    // ==========================================
    function BackgroundDotsCanvas({ dotSpeed = 1, dotCount = 75, connectDistance = 110 }) {
      useEffect(() => {
        const canvas = document.getElementById('particle-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        // Mouse attraction / repulsion tracking
        const mouse = { x: null, y: null, radius: 140 };
        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        };
        const handleMouseLeave = () => {
          mouse.x = null;
          mouse.y = null;
        };
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);

        // Initialize particles
        const particles = [];
        for (let i = 0; i < dotCount; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.9 * dotSpeed,
            vy: (Math.random() - 0.5) * 0.9 * dotSpeed,
            radius: Math.random() * 2.2 + 1.2,
            baseAlpha: Math.random() * 0.45 + 0.35,
            colorHue: Math.random() > 0.4 ? '0, 110, 180' : '0, 165, 235'
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          // Update & draw particles
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];

            // Movement
            p.x += p.vx;
            p.y += p.vy;

            // Bounce on edges
            if (p.x < 0 || p.x > width) p.vx *= -1;
            if (p.y < 0 || p.y > height) p.vy *= -1;

            // Mouse proximity repulsion/nudge
            if (mouse.x !== null && mouse.y !== null) {
              const dx = p.x - mouse.x;
              const dy = p.y - mouse.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < mouse.radius) {
                const force = (mouse.radius - dist) / mouse.radius;
                p.x += (dx / dist) * force * 2.5;
                p.y += (dy / dist) * force * 2.5;
              }
            }

            // Draw dot
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${p.colorHue}, ${p.baseAlpha})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = `rgba(${p.colorHue}, 0.5)`;
            ctx.fill();
            ctx.shadowBlur = 0; // reset shadow

            // Connect neighboring dots with subtle lines
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
              if (dist < connectDistance) {
                const alpha = (1 - dist / connectDistance) * 0.28;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(0, 120, 195, ${alpha})`;
                ctx.lineWidth = 0.85;
                ctx.stroke();
              }
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          cancelAnimationFrame(animationFrameId);
        };
      }, [dotSpeed, dotCount, connectDistance]);

      return null;
    }

      // Scroll Spy: Automatically detect active section while scrolling

        const handleScroll = () => {
          const scrollY = window.scrollY;
          const viewportHeight = window.innerHeight;
          const fullHeight = document.documentElement.scrollHeight;

          // If scrolled to near the bottom of the page, activate Contact
          if (scrollY + viewportHeight >= fullHeight - 80) {
            setActiveTab('Contact');
            return;
          }

          const triggerOffset = 180;
          let currentTab = 'About';

          for (const link of navLinks) {
            const section = document.getElementById(link.id);
            if (section) {
              const sectionTop = section.offsetTop - triggerOffset;
              const sectionHeight = section.offsetHeight;
              if (scrollY >= sectionTop && scrollY < sectionTop + sectionHeight) {
                currentTab = link.label;
                break;
              }
            }
          }
          setActiveTab(currentTab);
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // Smooth Sliding Underline Position Calculation

            width: activeLinkEl.offsetWidth,
